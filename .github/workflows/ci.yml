name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tools
        run: python -m pip install ruff==0.17.1 mypy==2.4.0

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Mypy
        run: mypy

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install coverage (tests themselves are stdlib only)
        run: python -m pip install "coverage[toml]>=7.6"

      - name: Syntax and version check
        run: |
          python -m py_compile opsh.py
          python opsh.py --version

      - name: Unit tests with coverage
        env:
          PYTHONIOENCODING: utf-8
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Coverage report (fails under 85%)
        run: python -m coverage report

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
