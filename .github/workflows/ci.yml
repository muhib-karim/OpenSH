name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile opsh.py

      - name: Version check
        run: python opsh.py --version

      # LLM calls are mocked; no API keys are needed
      - name: Run tests
        run: python -m pytest

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check syntax
        run: python -m py_compile opsh.py

      - name: Lint shell scripts
        run: shellcheck -S warning install.sh uninstall.sh

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in "install.ps1", "uninstall.ps1") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "${file}: $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Check PowerShell scripts are ASCII (Windows PowerShell 5.1 misreads BOM-less UTF-8)
        run: "! grep -nP '[^\\x00-\\x7F]' install.ps1 uninstall.ps1"
