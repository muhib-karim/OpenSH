name: Release

# On a v* tag: test, build standalone binaries for Windows, Linux and macOS, smoke-test them and
# publish a GitHub Release with SHA256 checksums. Pushes to upgrade/** branches run the same build
# without publishing, so a broken build is caught before anything is tagged.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'upgrade/**'
    paths:
      - opsh.py
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.4.0)'
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        run: python -m unittest discover -s tests -q

  build:
    name: Build on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: opsh-windows
          - os: ubuntu-latest
            artifact_name: opsh-linux
          - os: macos-latest
            artifact_name: opsh-macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6,<7"

      - name: Build standalone executable
        run: pyinstaller --onefile --name opsh opsh.py

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENSH_PROVIDER: mock
          OPENSH_NO_UPDATE_CHECK: '1'
          PYTHONIOENCODING: utf-8
        run: |
          ./dist/opsh.exe --version
          ./dist/opsh.exe -n -c "list files"

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          OPENSH_PROVIDER: mock
          OPENSH_NO_UPDATE_CHECK: '1'
        run: |
          ./dist/opsh --version
          ./dist/opsh -n -c "list files"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/opsh-windows | Out-Null
          Copy-Item dist/opsh.exe, install.ps1, uninstall.ps1, README.md, LICENSE, docs/opsh.1 dist/opsh-windows/
          Compress-Archive -Path dist/opsh-windows/* -DestinationPath opsh-windows.zip

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp dist/opsh install.sh uninstall.sh README.md LICENSE docs/opsh.1 dist/${{ matrix.artifact_name }}/
          chmod +x dist/${{ matrix.artifact_name }}/opsh dist/${{ matrix.artifact_name }}/install.sh
          cd dist && tar -czvf ../${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            opsh-windows.zip
            opsh-linux.tar.gz
            opsh-macos.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          sha256sum */*.zip */*.tar.gz | sed 's#  [^/]*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenSH v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/opsh-windows/*.zip
            artifacts/opsh-linux/*.tar.gz
            artifacts/opsh-macos/*.tar.gz
            artifacts/SHA256SUMS.txt
