name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must equal __version__ in opsh.py (e.g. 0.4.0)'
        required: true

# Jobs get a read-only token. Only the job that publishes the release can write.
permissions:
  contents: read

jobs:
  verify:
    name: Check version and run tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The input goes through the environment, never straight into the script,
      # and has to be a plain X.Y.Z that matches what the program reports.
      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The release version must look like X.Y.Z"
            exit 1
          fi
          actual="$(python opsh.py --version)"
          if [ "$actual" != "OpenSH v$version" ]; then
            echo "::error::Release $version does not match opsh.py, which reports: $actual"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests

  build-and-release:
    name: Build on ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: opsh-windows
            install_script: install.ps1
          - os: ubuntu-latest
            artifact_name: opsh-linux
            install_script: install.sh
          - os: macos-latest
            artifact_name: opsh-macos
            install_script: install.sh

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.22.3

      - name: Create standalone executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --name opsh opsh.py
          mkdir -p dist/opsh-windows
          cp dist/opsh.exe dist/opsh-windows/
          cp install.ps1 dist/opsh-windows/
          cp uninstall.ps1 dist/opsh-windows/
          cp README.md dist/opsh-windows/

      - name: Create standalone executable (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --name opsh opsh.py
          mkdir -p dist/${{ matrix.artifact_name }}
          cp dist/opsh dist/${{ matrix.artifact_name }}/
          cp install.sh dist/${{ matrix.artifact_name }}/
          cp uninstall.sh dist/${{ matrix.artifact_name }}/
          cp README.md dist/${{ matrix.artifact_name }}/
          chmod +x dist/${{ matrix.artifact_name }}/opsh
          chmod +x dist/${{ matrix.artifact_name }}/install.sh

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path dist/opsh-windows/* -DestinationPath opsh-windows.zip

      - name: Create archive (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist && tar -czvf ../${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            opsh-windows.zip
            opsh-linux.tar.gz
            opsh-macos.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [verify, build-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect archives and write checksums
        run: |
          mkdir release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenSH v${{ needs.verify.outputs.version }}
          tag_name: v${{ needs.verify.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
