<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-label="Terminal session: opsh --version, an explained command held by the safety guard, a dry run, and the test suite passing">
<rect width="760" height="450" rx="12" fill="#0f0d0a" stroke="#2e2a22" stroke-width="2"/>
<path d="M1 12 A11 11 0 0 1 12 1 H748 A11 11 0 0 1 759 12 V36 H1 Z" fill="#14120e"/>
<circle cx="22" cy="18" r="6" fill="#ff6b5e"/><circle cx="42" cy="18" r="6" fill="#f5a524"/><circle cx="62" cy="18" r="6" fill="#5fd38d"/>
<text x="380" y="23" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8f8676" text-anchor="middle">opsh 0.4.0</text>
<g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve" style="white-space:pre">
<text x="24" y="58"><tspan fill="#5fd38d">$ </tspan><tspan fill="#f4efe6">opsh --version</tspan></text>
<text x="24" y="79"><tspan fill="#f5a524">OpenSH v0.4.0</tspan></text>
<text x="24" y="121"><tspan fill="#5fd38d">$ </tspan><tspan fill="#f4efe6">opsh --explain -c &quot;clean the build folder&quot;</tspan></text>
<text x="24" y="142"><tspan fill="#f5a524">→ rm -rf build</tspan></text>
<text x="24" y="163"><tspan fill="#6cc7d9">ℹ Deletes the build folder and everything in it.</tspan></text>
<text x="24" y="184"><tspan fill="#ff6b5e">⚠ Deletes files recursively or without asking. Run it? [y/N] </tspan><tspan fill="#f4efe6">n</tspan></text>
<text x="24" y="205"><tspan fill="#b9b0a0">Skipped.</tspan></text>
<text x="24" y="247"><tspan fill="#5fd38d">$ </tspan><tspan fill="#f4efe6">opsh --dry-run -c &quot;show disk usage by folder&quot;</tspan></text>
<text x="24" y="268"><tspan fill="#f5a524">→ du -sh */ | sort -rh</tspan></text>
<text x="24" y="289"><tspan fill="#b9b0a0">(dry run - not executed)</tspan></text>
<text x="24" y="331"><tspan fill="#5fd38d">$ </tspan><tspan fill="#f4efe6">python -m unittest discover -s tests</tspan></text>
<text x="24" y="352"><tspan fill="#b9b0a0">Ran 130 tests in 0.9s</tspan></text>
<text x="24" y="373"><tspan fill="#5fd38d">OK</tspan></text>
<text x="24" y="394"><tspan fill="#5fd38d">$ </tspan><tspan fill="#f4efe6">coverage report</tspan></text>
<text x="24" y="415"><tspan fill="#5fd38d">opsh.py    840 stmts    4 miss    99%</tspan></text>
</g>
</svg>
